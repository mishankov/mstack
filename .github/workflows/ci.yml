name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Go and skill catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Test Go CLI and validate catalog
        env:
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Test PR watcher
        run: python -m unittest discover -s tests
